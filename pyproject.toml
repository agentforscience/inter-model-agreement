[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = "==3.12.*"
dependencies = [
    "bitsandbytes>=0.50.2",
    "datasets>=1.1.1",
    "huggingface-hub>=1.33.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "vllm>=0.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
